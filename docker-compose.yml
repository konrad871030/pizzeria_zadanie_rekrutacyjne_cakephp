services:
  cakephp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cakephp-app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://my_app:secret@mysql:3306/my_app?encoding=utf8mb4"
      APP_FULL_BASE_URL: "http://localhost:8765"
    volumes:
      - ./app:/app
    ports:
      - "8765:8765"
  mysql:
    image: mysql:8.4
    container_name: cakephp-mysql
    environment:
      MYSQL_DATABASE: my_app
      MYSQL_USER: my_app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
